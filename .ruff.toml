# Require a specific Ruff version for reproducible linting across environments
required-version = ">=0.6.0"

# Target Python version for type checking and syntax validation
target-version = "py312"

# Directories and files to exclude from linting
exclude = [
    "demo",    # Example/demo code not subject to strict linting
    "docs",    # Documentation source files
]

# Maximum line length for both linting and formatting
line-length = 120

[lint]
# Base rule sets to enable
select = [
    # Pyflakes - basic syntax and undefined name checking
    "F",
    # Pycodestyle (PEP 8) - style violations
    "E", "W",
    # Pylint - various code quality checks
    "C", "R",
    # isort - import sorting (covered by Ruff natively)
    "I",
    # Pyupgrade - Python version compatibility
    "UP",
    # Flake8 plugins (grouped by category)
    "C4",   # flake8-comprehensions
    "C90",  # McCabe complexity
    "B",    # flake8-bugbear
    "BLE",  # flake8-blind-except
    "A",    # flake8-builtins
    "COM",  # flake8-commas
    "DTZ",  # flake8-datetimez
    "T10",  # flake8-debugger
    "EM",   # flake8-errmsg
    "FA",   # flake8-future-annotations
    "ISC",  # flake8-implicit-str-concat
    "ICN",  # flake8-import-conventions
    "LOG",  # flake8-logging
    "G",    # flake8-logging-format
    "INP",  # flake8-no-pep420
    "PIE",  # flake8-pie
    "T20",  # flake8-print
    "PYI",  # flake8-pyi
    "PT",   # flake8-pytest-style
    "RSE",  # flake8-raise
    "RET",  # flake8-return
    "SLF",  # flake8-self
    "SLOT", # flake8-slots
    "SIM",  # flake8-simplify
    "TID",  # flake8-tidy-imports
    "TCH",  # flake8-type-checking
    "INT",  # flake8-gettext
    "ARG",  # flake8-pie
    "TD",   # flake8-todos
    "FIX",  # flake8-ffixme
    # Additional categories
    "N",    # pep8-naming
    "D",    # pydocstyle
    "YTT",  # flake8-2020
    "ASYNC", # flake8-async
]

# Rules to ignore with justification
ignore = [
    "F811",    # Redefinition of unused name (common in tests/notebooks)
    "ARG002",  # Unused function argument (false positives with **kwargs)
]

# All enabled rules are fixable by default
fixable = ["ALL"]
unfixable = []

# Pycodestyle (PEP 8) specific overrides
[lint.pycodestyle]
# Don't flag overlong comments in task markers
ignore-overlong-task-comments = true
# Maximum length for docstrings (separate from code line-length)
max-doc-length = 100

# Pydocstyle configuration
[lint.pydocstyle]
# Use numpy docstring convention for this project
convention = "numpy"

# Formatting rules (applied with `ruff format`)
[format]
# Use single quotes for strings
quote-style = "single"
# Use spaces for indentation (PEP 8 default)
indent-style = "space"
# Don't skip trailing commas in multi-line collections
skip-magic-trailing-comma = false
# Format code examples in docstrings
docstring-code-format = true
# Use dynamic line length for docstring code (matches main line-length)
docstring-code-line-length = "dynamic"
