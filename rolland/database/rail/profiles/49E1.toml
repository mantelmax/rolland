# UIC60 rail profile.
#
# File format
# -----------
# Every table except [meta] contributes its keys directly as arguments to
# ``rolland.components.Rail``; the grouping into [material], [geometry] and
# [cross_section] is documentation only and carries no meaning for the loader.
# The special key ``outline`` names a CSV file (columns ``Y,Z``, in metres)
# located next to this file, which is loaded into ``Rail.rl_geo``.

[meta]
name = "49E1"                 # must match the file name
standard = "EN 13674-1 (49E1)"
description = "Standard 49E1 Profile"
# source = ""                  # TODO: add the reference the values below were taken from

[material]
E = 210e9                      # Young's modulus [Pa]
G = 80.769e9                   # shear modulus [Pa]
nu = 0.3                       # Poisson's ratio [-]
rho = 7860.0                   # density [kg/m^3]
etar = 0.02                    # loss factor [-] #TODO
dr = 1000.0                    # viscous damping coefficient [Ns/m]

[geometry]
outline = "49E1.csv"           # rail outline coordinates [m]
mr = 60.2                      # mass per unit length [kg/m] #TODO
Ar = 62.92e-4                  # cross-section area [m^2]
Asr = 0.688                    # surface area per unit length [m^2/m] #TODO
Vr = 7670.00e-6                # volume per unit length [m^3/m] #TODO
shearc = [0.0, 33e-3]          # shear centre [m] #TODO
centr = [0.0, 0.0]             # centroid [m]

[cross_section]
Iyr = 1.83086e-05              # second moment of area about y (vertical bending) [m^4]
Izr = 3.21079e-06              # second moment of area about z (lateral bending) [m^4]
Iyz = 4.89773e-11              # product moment of area [m^4]
Ipr = 2.15194e-05              # polar moment of area [m^4]
J = 1.77870e-06                # torsional constant [m^4]
kapz = 0.35509                 # Timoshenko shear correction factor, vertical [-]
kapy = 0.60808                 # Timoshenko shear correction factor, lateral [-]
kapp_s = 1.0                   # correction factor for effective shear from restrained warping [-]
Iw = 1.04849e-08               # warping constant [m^6]
Iwz = -7.74601e-08             # warping product moment of area [m^5]
Iwy = -4.22482e-12             # warping product moment of area [m^5]
k_w = 3.68936e-02              # warping factor for the rail foot [-]
chi = 0.0                      # warping function; placeholder, see TODO in rolland.components.Rail #TODO
