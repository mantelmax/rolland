# 54E1 rail profile.
#
# File format
# -----------
# Every table except [meta] contributes its keys directly as arguments to
# ``rolland.components.Rail``; the grouping into [material], [geometry] and
# [cross_section] is documentation only and carries no meaning for the loader.
# The special key ``outline`` names a CSV file (columns ``Y,Z``, in metres)
# located next to this file, which is loaded into ``Rail.rl_geo``.
# The optional special key ``warping`` names an NPY file (columns ``Y, Z, chi``)
# located next to this file, which is loaded into ``Rail.chi``.

[meta]
name = "rail_54E1"             # must match the file name
standard = "EN 13674-1 (54E1, UIC54)"
description = "54 kg/m mainline rail, the second most common European profile."
# source = "https://grabcad.com/library/european-standard-most-common-rail-profiles-30e1-33e1-s33-39e1-bs80a-45e1-bs90a-45e3-rn45-46e2-u33-49e1-s49-49e5-50e6-u50-54e1-uic54-54e2-uic54e-54e3-s54-54e4-54e5-56e1-60e1-uic60-and-60e2-1"
# Source for Profiles. The geometric and cross section values were calculated by our team. accessed 17.09.2026

[material]
E = 210e9                      # Young's modulus [Pa]
G = 80.769e9                   # shear modulus [Pa]
nu = 0.3                       # Poisson's ratio [-]
rho = 7860.0                   # density [kg/m^3]
etar = 0.02                    # loss factor [-]
dr = 1000.0                    # viscous damping coefficient [Ns/m]

[geometry]
outline = "rail_54E1.csv"      # rail outline coordinates [m]
warping = "rail_54E1_warping.npy"  # warping function about the shear center: Y [m], Z [m], chi [m^2]
mr = 54.80951                  # mass per unit length [kg/m]
Ar = 6.97322e-03               # cross-section area [m^2]
Asr = 6.31838e-01              # surface area per unit length [m^2/m]
Vr = 6.97322e-03               # volume per unit length [m^3/m]
shearc = [0.0, 28.3e-03]       # shear centre [m]
centr = [0.0, 0.0]             # centroid [m]

[cross_section]
Iyr = 2.33722e-05              # second moment of area about y (vertical bending) [m^4]
Izr = 4.18905e-06              # second moment of area about z (lateral bending) [m^4]
Iyz = 0.0                      # product moment of area [m^4]
Ipr = 2.75613e-05              # polar moment of area [m^4]
J = 1.88818e-06                # torsional constant [m^4]
kapz = 0.38750                 # Timoshenko shear correction factor, vertical [-]
kapy = 0.55997                 # Timoshenko shear correction factor, lateral [-]
kapp_s = 1.0                   # correction factor for effective shear from restrained warping [-]
Iw = 1.49896e-08               # warping constant [m^6]
Iwz = 1.18569e-07              # warping product moment of area [m^5]
Iwy = 0.0                      # warping product moment of area [m^5]
k_w = 5.33256e-01              # warping factor for the rail foot [-]
